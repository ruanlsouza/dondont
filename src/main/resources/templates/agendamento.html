<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agendamento | Donodont</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}">
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">Donodont</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li><li class="nav-item"><a class="nav-link" th:href="@{/painel}">Painel</a></li><li class="nav-item"><a class="nav-link active" th:href="@{/agendamento}">Agendamento</a></li></ul></div></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><div class="card shadow"><div class="card-body p-4">
<h1 class="text-primary text-center mb-4">Agendar consulta</h1><div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
<form th:action="@{/agendamento}" method="post">
<div class="mb-3"><label for="servico" class="form-label">Serviço</label><select id="servico" name="servico" class="form-select" required>
<option value="">Selecione um serviço</option><option value="Limpeza Dental">Limpeza Dental</option><option value="Clareamento Dental">Clareamento Dental</option><option value="Ortodontia">Ortodontia</option><option value="Restauração">Restauração</option><option value="Extração Dentária">Extração Dentária</option><option value="Avaliação Odontológica">Avaliação Odontológica</option>
</select></div><div class="mb-3"><label for="data" class="form-label">Data desejada</label><input id="data" name="data" type="date" class="form-control" required></div>
<button type="submit" class="btn btn-primary w-100">Enviar solicitação</button></form><p class="text-center mt-3 mb-0"><a th:href="@{/painel}">Voltar ao painel</a></p>
</div></div></div></div></main>
<footer class="bg-primary text-white text-center py-3"><p class="mb-0">© 2026 Donodont - Todos os direitos reservados.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/script.js}" defer></script>
</body></html>
