<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento | Donodont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Donodont</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/sobre">Sobre</a></li>
                <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="/cadastro">Cadastro</a></li>
                <li class="nav-item"><a class="nav-link active" href="/painel">Painel</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h1 class="text-primary text-center mb-4">Agendar consulta</h1>
                    <form action="/painel" method="get">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input id="nome" name="nome" type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input id="email" name="email" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="servico" class="form-label">Serviço</label>
                            <select id="servico" name="servico" class="form-select" required>
                                <option value="">Selecione um serviço</option>
                                <option>Limpeza Dental</option>
                                <option>Clareamento Dental</option>
                                <option>Ortodontia</option>
                                <option>Restauração</option>
                                <option>Extração Dentária</option>
                                <option>Avaliação Odontológica</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="data" class="form-label">Data desejada</label>
                            <input id="data" name="data" type="date" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Enviar solicitação</button>
                    </form>
                    <p class="text-center mt-3 mb-0"><a href="/painel">Voltar ao painel</a></p>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="bg-primary text-white text-center py-3">
    <p class="mb-0">© 2026 Donodont - Todos os direitos reservados.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
