<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Donodont</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Donodont</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link " th:href="@{/}">Home</a></li>
                <li class="nav-item"><a class="nav-link " th:href="@{/sobre}">Sobre</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/login}">Login</a></li>
                <li class="nav-item"><a class="nav-link " th:href="@{/cadastro}">Cadastro</a></li>
                <li class="nav-item"><a class="nav-link " th:href="@{/painel}">Painel</a></li>
                <li class="nav-item"><a class="nav-link " th:href="@{/agendamento}">Agendamento</a></li>
            </ul>
        </div>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card shadow"><div class="card-body p-4">
            <h2 class="text-center text-primary mb-4">Entrar na Donodont</h2>
            <form action="/painel" method="get">
                <div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" name="email" type="email" class="form-control" placeholder="Digite seu e-mail" required></div>
                <div class="mb-3"><label for="senha" class="form-label">Senha</label><input id="senha" name="senha" type="password" class="form-control" placeholder="Digite sua senha" required></div>
                <button type="submit" class="btn btn-primary w-100">Confirmar Login</button>
            </form>
            <p class="text-center mt-3 mb-0">Ainda não possui uma conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
        </div></div>
    </div></div>
</main>
<footer class="bg-primary text-white text-center py-3">
    <p class="mb-0">© 2026 Donodont - Todos os direitos reservados.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
