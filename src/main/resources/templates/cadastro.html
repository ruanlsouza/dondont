<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Cliente | Donodont</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/style.css}">
</head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" th:href="@{/}">Donodont</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li><li class="nav-item"><a class="nav-link" th:href="@{/sobre}">Sobre</a></li><li class="nav-item"><a class="nav-link" th:href="@{/login}">Login</a></li><li class="nav-item"><a class="nav-link active" th:href="@{/cadastro}">Cadastro</a></li>
</ul></div></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-7"><div class="card shadow"><div class="card-body p-4">
<h2 class="text-center text-primary mb-4">Cadastro de Cliente</h2><p class="text-center text-secondary">Preencha seus dados para se cadastrar na Donodont.</p>
<div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
<form id="formCadastro" th:action="@{/cadastro}" method="post">
<div class="mb-3"><label for="nome" class="form-label">Nome completo</label><input id="nome" name="nome" type="text" class="form-control" maxlength="120" required></div>
<div class="row"><div class="col-md-6 mb-3"><label for="cpf" class="form-label">CPF</label><input id="cpf" name="cpf" type="text" class="form-control" placeholder="000.000.000-00" maxlength="14" required></div>
<div class="col-md-6 mb-3"><label for="nascimento" class="form-label">Data de nascimento</label><input id="nascimento" name="nascimento" type="date" class="form-control" required></div></div>
<div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" name="email" type="email" class="form-control" maxlength="150" required></div>
<div class="mb-3"><label for="telefone" class="form-label">Telefone</label><input id="telefone" name="telefone" type="tel" class="form-control" placeholder="(00) 00000-0000" maxlength="20" required></div>
<div class="mb-3"><label for="endereco" class="form-label">Endereço</label><input id="endereco" name="endereco" type="text" class="form-control" maxlength="200" required></div>
<div class="row"><div class="col-md-6 mb-3"><label for="senha" class="form-label">Senha</label><input id="senha" name="senha" type="password" class="form-control" minlength="6" required></div>
<div class="col-md-6 mb-3"><label for="confirmarSenha" class="form-label">Confirmar senha</label><input id="confirmarSenha" name="confirmarSenha" type="password" class="form-control" minlength="6" required></div></div>
<button type="submit" class="btn btn-primary w-100">Cadastrar</button><p class="text-center mt-3 mb-0">Já possui uma conta? <a th:href="@{/login}">Faça login</a></p>
</form></div></div></div></div></main>
<footer class="bg-primary text-white text-center py-3"><p class="mb-0">© 2026 Donodont - Todos os direitos reservados.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script th:src="@{/js/script.js}" defer></script>
</body></html>
